<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Generator</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        #qrcode {
            margin: 30px auto;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Digital Visiting Card QR</h1>

        <div id="qrcode"></div>

        <p>https://jawahaartheella.github.io/digital-visiting-card/</p>

    </div>

    <script>

        const websiteURL = "https://jawahaartheella.github.io/digital-visiting-card/";

        new QRCode(document.getElementById("qrcode"), {
            text: websiteURL,
            width: 500,
            height: 500,
            correctLevel: QRCode.CorrectLevel.H
        });

    </script>

</body>
</html>
